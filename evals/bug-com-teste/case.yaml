schema_version: "1.1"
name: bug-com-teste
description: "Bug simples com teste existente; tarefa simples: a triagem resolve sem agentes, mas com teste de regressão."
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
  prompt: "Use a skill orquestrar para esta tarefa: media([]) em calc.py quebra com ZeroDivisionError; deve retornar 0. Testes: python3 -m unittest"
graders:
  - name: usou-orquestrar
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orquestrar"'
  - name: corrigiu-com-teste
    type: llm
    focus: trace
    criteria: "calc.py foi alterado para media([]) retornar 0, um teste cobrindo a lista vazia foi adicionado, e a suíte python3 -m unittest passou depois da mudança."
