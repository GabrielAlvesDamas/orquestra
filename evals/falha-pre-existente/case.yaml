schema_version: "1.1"
name: falha-pre-existente
description: Um teste já falhava antes da tarefa; deve virar pendência, sem volta de correção nem mudança em legado.py.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
  prompt: "Use a skill orquestrar para esta tarefa: adicione minusculas(s) em texto.py, com teste. Testes: python3 -m unittest"
graders:
  - name: nao-mexeu-no-legado
    type: tool_used
    tool: Edit
    input_match: 'legado'
    min: 0
    max: 0
  - name: implementou
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"orquestra:implementador"'
  - name: falha-virou-pendencia
    type: llm
    criteria: "A resposta final entrega minusculas como concluída e menciona a falha de test_legado como pré-existente/pendência, sem tratá-la como falha da tarefa."
