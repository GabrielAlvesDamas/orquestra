name: validar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON do plugin válidos
        run: for f in .claude-plugin/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Bloco de handoff idêntico nos agentes
        run: |
          n=$(for f in agents/*.md; do sed -n '/^## Protocolo de handoff/,$p' "$f" | md5sum; done | sort -u | wc -l)
          [ "$n" -eq 1 ] || { echo "Protocolo de handoff divergiu entre os agentes"; exit 1; }
